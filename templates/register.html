{% extends "base.html" %}
{% block title %}Register - FixerUpper{% endblock %}
{% block content %}
<section class="form-shell">
  <form class="auth-form" method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <h1>Create Account</h1>
    <p>Use a strong password. It will be stored only as a bcrypt hash.</p>
    <div class="field">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" autocomplete="name" maxlength="80" pattern="[^<>]+" value="{{ name or '' }}" required>
    </div>
    <div class="field">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="120" value="{{ email or '' }}" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
      <small>At least 10 characters with uppercase, lowercase, and a number.</small>
    </div>
    <button class="button button-primary full-width" type="submit">Register securely</button>
    <p class="form-note">Already registered? <a href="{{ url_for('login') }}">Login here</a>.</p>
  </form>
</section>
{% endblock %}
